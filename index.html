<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dice.css" />
  </head>
  <body>
    <main>
      <div class="main-container">
        <div class="player-control player-4"></div>
        <div class="player-control player-3"></div>
        <div class="player-control player-2"></div>
        <div class="player-control player-1">
          <div class="dice-container">
            <div class="cube-container">
              <div class="outer-cube">
                <div class="cube">
                  <div class="face top face-3">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                  </div>
                  <div class="face bottom face-4">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                  </div>
                  <div class="face back face-6">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                  </div>
                  <div class="face front face-1">
                    <div class="dot"></div>
                  </div>
                  <div class="face right face-2">
                    <div class="dot"></div>
                    <div class="dot"></div>
                  </div>
                  <div class="face left face-5">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="board">
          <div class="home player-1">
            <div class="home-container">
              <div class="home-dot player-1"></div>
              <div class="home-dot player-1"></div>
              <div class="home-dot player-1"></div>
              <div class="home-dot player-1"></div>
            </div>
          </div>
          <div class="home player-2">
            <div class="home-container">
              <div class="home-dot player-2"></div>
              <div class="home-dot player-2"></div>
              <div class="home-dot player-2"></div>
              <div class="home-dot player-2"></div>
            </div>
          </div>
          <div class="home player-3">
            <div class="home-container">
              <div class="home-dot player-3"></div>
              <div class="home-dot player-3"></div>
              <div class="home-dot player-3"></div>
              <div class="home-dot player-3"></div>
            </div>
          </div>
          <div class="home player-4">
            <div class="home-container">
              <div class="home-dot player-4"></div>
              <div class="home-dot player-4"></div>
              <div class="home-dot player-4"></div>
              <div class="home-dot player-4"></div>
            </div>
          </div>
          <div class="center">
            <div class="center-triangle player-1"></div>
            <div class="center-triangle player-2"></div>
            <div class="center-triangle player-3"></div>
            <div class="center-triangle player-4"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Debug Panel -->
    <div id="debug-panel" class="debug-panel">
      <h3>🛠️ Debug Testing Panel</h3>
      <div class="debug-section">
        <h4>Token Scenarios</h4>
        <button
          onclick="debugFunctions.createStackedTokens()"
          class="debug-btn"
        >
          📚 Stack Multiple Tokens
        </button>
        <button
          onclick="debugFunctions.createChaseScenario()"
          class="debug-btn"
        >
          🏃 Chase Scenario
        </button>
        <button
          onclick="debugFunctions.createAttackScenario()"
          class="debug-btn"
        >
          ⚔️ Attack Scenario
        </button>
        <button onclick="debugFunctions.sendTokenHome()" class="debug-btn">
          🏠 Send Token Home
        </button>
        <button
          onclick="debugFunctions.createFinishLineScenario()"
          class="debug-btn"
        >
          🏁 Finish Line Test
        </button>
        <button
          onclick="debugFunctions.testPlayer2FinishLine()"
          class="debug-btn"
        >
          🔵 Player 2 Finish Test
        </button>
      </div>

      <div class="debug-section">
        <h4>Game State</h4>
        <button onclick="debugFunctions.setDiceValue(6)" class="debug-btn">
          🎲 Force Six
        </button>
        <button onclick="debugFunctions.setDiceValue(1)" class="debug-btn">
          🎲 Force One
        </button>
        <button onclick="debugFunctions.showGameState()" class="debug-btn">
          📊 Show Game State
        </button>
        <button onclick="debugFunctions.resetGame()" class="debug-btn">
          🔄 Reset Game
        </button>
      </div>

      <div class="debug-section">
        <h4>Player Control</h4>
        <button onclick="debugFunctions.switchPlayer(1)" class="debug-btn">
          🔴 Player 1
        </button>
        <button onclick="debugFunctions.switchPlayer(2)" class="debug-btn">
          🔵 Player 2
        </button>
        <button onclick="debugFunctions.switchPlayer(3)" class="debug-btn">
          🟢 Player 3
        </button>
        <button onclick="debugFunctions.switchPlayer(4)" class="debug-btn">
          🟡 Player 4
        </button>
      </div>

      <div class="debug-section">
        <h4>Board Rotation</h4>
        <button onclick="debugFunctions.testBoardRotation()" class="debug-btn">
          🔄 Test Rotation Cycle
        </button>
        <button onclick="debugFunctions.testDiceMovement()" class="debug-btn">
          🎲 Test Dice Movement
        </button>
        <button
          onclick="window.BOTTOM_LEFT_PLAYER=1; setBoardRotation()"
          class="debug-btn"
        >
          🔴 Player 1 Bottom-Left
        </button>
        <button
          onclick="window.BOTTOM_LEFT_PLAYER=2; setBoardRotation()"
          class="debug-btn"
        >
          🔵 Player 2 Bottom-Left
        </button>
        <button
          onclick="window.BOTTOM_LEFT_PLAYER=3; setBoardRotation()"
          class="debug-btn"
        >
          🟢 Player 3 Bottom-Left
        </button>
        <button
          onclick="window.BOTTOM_LEFT_PLAYER=4; setBoardRotation()"
          class="debug-btn"
        >
          🟡 Player 4 Bottom-Left
        </button>
      </div>

      <button
        id="debug-toggle"
        onclick="debugFunctions.togglePanel()"
        class="debug-toggle"
      >
        🛠️ Debug
      </button>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="dice.js"></script>
  </body>
</html>
